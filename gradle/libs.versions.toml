[versions]
paper = "26.2.build.+"
bstats = "3.2.1"
sqdlib = "2.1.2"

placeholderapi = "2.12.3"
luckperms = "5.5"
essx = "2.21.2"
dc-srv = "1.29.0"

strokk-commands = "2.3.0"

lettuce = "7.9.0.RELEASE"
rabbitmq = "5.37.0"
jnats = "2.26.4"


shadow = "9.6.1"
run-task = "3.1.0"

[libraries]
paper = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
bstats-bukkit = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }
sqdlib-paper = { module = "net.chamosmp.sqdlib:sqdlib-paper", version.ref = "sqdlib" }

placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
luckperms = { module = "net.luckperms:api", version.ref = "luckperms" }

essx = { module = "net.essentialsx:EssentialsX", version.ref = "essx" }
essx-discord = { module = "net.essentialsx:EssentialsXDiscord", version.ref = "essx" }
discordsrv = { module = "com.discordsrv:discordsrv", version.ref = "dc-srv" }

strokk-paper = { module = "net.strokkur.commands:annotations-paper", version.ref = "strokk-commands" }
strokk-paper-proccesor = { module = "net.strokkur.commands:processor-paper", version.ref = "strokk-commands" }

lettuce = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
rabbitmq = { module = "com.rabbitmq:amqp-client", version.ref = "rabbitmq" }
jnats = { module = "io.nats:jnats", version.ref = "jnats" }

[plugins]

shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-task" }