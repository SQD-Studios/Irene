main: net.chamosmp.irene.IrenePlugin
loader: net.chamosmp.irene.IreneLoader

name: Irene

authors: [ "SQD Studios" ]
description: ${description}
version: ${version}

api-version: "1.21"

folia-supported: true

dependencies:
  server:
    LuckPerms:
      load: BEFORE
      required: true
    PlaceholderAPI:
      load: BEFORE
      required: false
    DiscordSRV:
      load: BEFORE
      required: false
    EssentialsDiscord:
      load: BEFORE
      required: false
    LiteBans:
      load: BEFORE
      required: false
      join-classpath: false
    ChamoSMP-modl:
      load: before
      required: false
    floodgate:
      load: before
      required: false
    packetevents:
      load: before
      required: false
      join-classpath: true

permissions:
  irene.admin:
    default: op
    children:
      irene.admin.spy: true
      irene.admin.reload: true
      irene.admin.clear: true
      irene.admin.preview: true

  irene.broadcast:
    default: op

  irene.pingtoggle:
    default: true

  irene.minimessage.bypass.default:
    default: false
  irene.minimessage.bypass.noninteractable:
    default: false
  irene.minimessage.bypass.formattedtext:
    default: false

