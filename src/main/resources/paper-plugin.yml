main: net.chamosmp.irene.IrenePlugin
loader: net.chamosmp.irene.IreneLoader

name: Irene

authors: [ "SQD Studios" ]
description: ${description}
version: ${version}

api-version: 1.21

folia-supported: true

dependencies:
  server:
    LuckPerms:
      load: BEFORE
      required: true
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    DiscordSRV:
      load: BEFORE
      required: false
      join-classpath: true
    EssentialsDiscord:
      load: BEFORE
      required: false
      join-classpath: true
    LiteBans:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  irene.admin:
    default: op
    children:
      permission.node.child: true
  irene.admin.spy:
    default: op
    children:
      permission.node.child: true
  irene.admin.reload:
    default: op
    children:
      permission.node.child: true
  irene.broadcast:
    default: op
